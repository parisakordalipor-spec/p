<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/css/ifg.css">
<style>html,body{margin:0;padding:0;background:#eaeeed}</style></head><body>
<div class="ifg ifg--js ifg--ready ifg--rtl ifg--overlay-fixed ifg--click-content" id="ifg-1" dir="rtl"
     data-settings='{"overlay":"fixed","pageMode":false,"wheel":true,"parallax":true,"textEffect":"words"}'>
  <div class="ifg__gallery" id="ifg-gal-1">
    <figure class="ifg__slide" data-index="0"><div class="ifg__img"><img src="img/6.webp" data-full="img/6.webp" alt="a" class="skip-lazy no-lazy"></div><figcaption class="ifg__caption">کفش آدیداس</figcaption></figure>
    <figure class="ifg__slide" data-index="1"><div class="ifg__img"><img src="img/4.webp" data-full="img/4.webp" alt="b" class="skip-lazy no-lazy"></div><figcaption class="ifg__caption">کفش دوم</figcaption></figure>
  </div>
  <div class="ifg__content" role="dialog" aria-modal="true" aria-hidden="true" style="display:block">
    <figure class="ifg__preview"><img src="img/shoe.png" alt="" class="skip-lazy no-lazy"></figure>
    <div class="ifg__groups">
      <button type="button" class="ifg__back" dir="auto">&larr; back [ESC]</button>
      <div class="ifg__group active" data-index="0">
        <h2 class="ifg__title" dir="auto">کفش آدیداس</h2>
        <div class="ifg__buy">
          <div class="ifg__price" dir="auto">۸۱۰,۰۰۰&nbsp;تومان</div>
          <button type="button" class="ifg__atc" data-ajax="1"><span class="ifg__atc-label">Add to cart</span></button>
        </div>
        <p class="ifg__desc" dir="auto">برند: Vans | رنگ: طوسی | سایز: 41</p>
        <div class="ifg__thumbnails" role="group" aria-label="نمایش‌های بیشتر">
          <button type="button" class="ifg__thumb is-active" data-full="img/6.webp" aria-pressed="true"><img src="img/23.webp" alt=""></button>
          <button type="button" class="ifg__thumb" data-full="img/2.webp" aria-pressed="false"><img src="img/2.webp" alt=""></button>
          <button type="button" class="ifg__thumb" data-full="img/4.webp" aria-pressed="false"><img src="img/4.webp" alt=""></button>
          <button type="button" class="ifg__thumb" data-full="img/20.webp" aria-pressed="false"><img src="img/20.webp" alt=""></button>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
